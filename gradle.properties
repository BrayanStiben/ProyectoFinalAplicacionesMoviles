# Configuración de estabilidad para evitar errores del daemon de Kotlin
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Forzar a Kotlin a compilar dentro del proceso de Gradle para evitar el cierre del daemon
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.useFallbackStrategy=true

# Mejoras de rendimiento y estabilidad en Windows
org.gradle.vfs.watch=false
org.gradle.parallel=true

# Ajustes estándar de Android
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
